name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # テスト(常に実行・決定的・APIキー不要)
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: clinic-rag-assistant
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: clinic_rag_test
          POSTGRES_USER: clinic
          POSTGRES_PASSWORD: secret
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U clinic -d clinic_rag_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
    env:
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_DATABASE: clinic_rag_test
      DB_USERNAME: clinic
      DB_PASSWORD: secret
      REDIS_HOST: 127.0.0.1
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo_pgsql, pgsql, bcmath, redis
          coverage: none
      - name: Composer install
        run: composer install --no-interaction --prefer-dist --no-progress
      - name: 環境準備
        run: |
          cp .env.example .env
          php artisan key:generate
      - name: テスト実行(Fakeドライバ・全機能)
        run: php artisan test

  # 検索精度(Recall@k)の回帰チェック。EMBEDDING_API_KEY が secrets に無ければスキップして緑にする。
  eval-retrieval:
    runs-on: ubuntu-latest
    needs: test
    defaults:
      run:
        working-directory: clinic-rag-assistant
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: clinic_rag
          POSTGRES_USER: clinic
          POSTGRES_PASSWORD: secret
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U clinic -d clinic_rag"
          --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
    env:
      DB_HOST: 127.0.0.1
      DB_DATABASE: clinic_rag
      DB_USERNAME: clinic
      DB_PASSWORD: secret
      REDIS_HOST: 127.0.0.1
      # 実embeddingで測るためのキー(未設定ならジョブ本体をスキップ)
      EMBEDDING_API_KEY: ${{ secrets.EMBEDDING_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - name: キー未設定の場合はスキップ
        id: guard
        run: |
          if [ -z "$EMBEDDING_API_KEY" ]; then
            echo "EMBEDDING_API_KEY 未設定のため retrieval 評価をスキップします(CIは緑)。"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: shivammathur/setup-php@v2
        if: steps.guard.outputs.skip != 'true'
        with:
          php-version: '8.3'
          extensions: pdo_pgsql, pgsql, bcmath, redis
      - name: セットアップ + シード + retrieval評価
        if: steps.guard.outputs.skip != 'true'
        env:
          EMBEDDING_DRIVER: voyage
          LLM_DRIVER: fake
        run: |
          composer install --no-interaction --prefer-dist --no-progress
          cp .env.example .env
          php artisan key:generate
          php artisan migrate --seed --force
          php artisan eval:seed
          php artisan eval:run --only=retrieval

  # 回答品質(Judge)を含むフル評価。main への push かつ ANTHROPIC_API_KEY 設定時のみ。
  eval-full:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    needs: test
    defaults:
      run:
        working-directory: clinic-rag-assistant
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: clinic_rag
          POSTGRES_USER: clinic
          POSTGRES_PASSWORD: secret
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U clinic -d clinic_rag"
          --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
    env:
      DB_HOST: 127.0.0.1
      DB_DATABASE: clinic_rag
      DB_USERNAME: clinic
      DB_PASSWORD: secret
      REDIS_HOST: 127.0.0.1
      EMBEDDING_API_KEY: ${{ secrets.EMBEDDING_API_KEY }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - name: キー未設定の場合はスキップ
        id: guard
        run: |
          if [ -z "$ANTHROPIC_API_KEY" ] || [ -z "$EMBEDDING_API_KEY" ]; then
            echo "APIキー未設定のためフル評価をスキップします(CIは緑)。"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: shivammathur/setup-php@v2
        if: steps.guard.outputs.skip != 'true'
        with:
          php-version: '8.3'
          extensions: pdo_pgsql, pgsql, bcmath, redis
      - name: セットアップ + シード + フル評価(コスト概算をログ)
        if: steps.guard.outputs.skip != 'true'
        env:
          EMBEDDING_DRIVER: voyage
          LLM_DRIVER: anthropic
        run: |
          composer install --no-interaction --prefer-dist --no-progress
          cp .env.example .env
          php artisan key:generate
          php artisan migrate --seed --force
          php artisan eval:seed
          echo "評価ケース: $(ls database/eval/cases/*.yaml | wc -l) 件 × (生成+採点) ≒ API呼び出し概算"
          php artisan eval:run
      - name: レポートをアーティファクト化
        if: steps.guard.outputs.skip != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: eval-report
          path: clinic-rag-assistant/storage/app/eval-reports/latest.md
