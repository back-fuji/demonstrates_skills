# ─────────────────────────────────────────────
# 予約・キャンセルポリシー
# ─────────────────────────────────────────────
cancellation_policy:
  same_day_cancel: "施術料金の50%が発生する"
  no_show: "無断キャンセル(ノーショー)は施術料金の100%が発生する"
  free_until: "前日の営業終了(20:00)までに連絡があればキャンセル料は無料"
  illness_exemption: "発熱・感染症の疑いなど体調不良の場合は、前日までに連絡があればキャンセル料を免除する(安全を優先)"

reservation_rules:
  channels: "WEB予約 / 電話 / 来院時の次回予約"
  change_deadline: "予約変更は前日の営業終了(20:00)まで。当日の変更はキャンセル扱いになる場合がある"
  late_arrival: "10分以上の遅刻は施術内容の短縮・変更をお願いする場合がある。15分以上の連絡なし遅刻は当日キャンセル(50%)として扱う"
  double_booking: "同一時間帯の重複予約は不可"

minor_policy:
  age: "18歳未満は原則、親権者の同伴または署名済み同意書が必要"
  consent_form: "未成年は施術ごとに親権者同意書を取得。15歳未満は保護者同伴を必須とする"
  restricted: "注入系(ボトックス・ヒアルロン酸)は原則18歳以上"

# ─────────────────────────────────────────────
# 接客・院内ルールの要点
# ─────────────────────────────────────────────
service_rules:
  first_visit_flow: "受付 → 問診票記入 → カウンセリング → 医師診察 → 施術説明・同意 → 会計/次回予約"
  phone: "3コール以内に応答。院名と担当者名を名乗る。医療内容の断定的回答は避け、医師・看護師に取り次ぐ"
  complaint: "まず傾聴と謝意、事実確認、その場で判断せず責任者(院長/マネージャー)へエスカレーション。記録を残す"
  payment: "現金・各種クレジットカード・医療ローン・QR決済に対応。コースは分割可。領収書・明細を必ず発行"
  online_booking: "WEB予約は24時間受付。初診はカウンセリング枠を案内。予約確定メールを自動送信"

workplace_rules:
  dress_code: "清潔な指定ユニフォーム着用。爪は短く、華美なネイル・アクセサリー・強い香水は不可。長い髪はまとめる"
  hygiene: "施術ごとに手指衛生とベッド・機器の消毒。使い捨て器材は再利用しない。針・鋭利物は専用容器へ廃棄"
  attendance: "始業15分前出勤。体調不良時は無理せず上長へ連絡。感染症罹患時は出勤停止基準に従う"
