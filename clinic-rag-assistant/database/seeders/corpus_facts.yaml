# corpus_facts.yaml
# 架空美容クリニック「Lumière Clinic」社内ナレッジのマスタデータ(ポートフォリオ用ダミー)。
# corpus/ 配下の全 Markdown 文書と database/eval/cases/ の評価ケースは、
# 本ファイルの数値・禁忌・ルールと矛盾しないよう記述すること。
#
# 注意:
#   - すべて架空の内容であり、実在の医療情報としての正確性は担保しない。
#   - 薬剤名は架空(リラクシン / ヒアルフィルEX / アクアグロウ / リポクリアMD)。
#   - 実在薬剤の危険な誤用法は記載しない。
#   - 料金はすべて税込・日本円。

clinic:
  name: "Lumière Clinic(ルミエールクリニック)"
  branches: ["新宿院", "銀座院", "横浜院"]
  business_hours: "10:00〜20:00(最終受付19:00)"
  closed: "年末年始のみ"

